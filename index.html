*{box-sizing:border-box}body{margin:0;background:#0a0e1a;color:#cbd5e1;font-family:'Inter',sans-serif}
a{color:inherit;text-decoration:none}
header{padding:25px 20px 15px;text-align:center;background:rgba(15,23,42,0.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;border-bottom:1px solid #1e293b}
header h1{font-size:38px;margin:0;font-weight:800;letter-spacing:-1px;color:#fff}header h1 span{color:#38bdf8}
.search-wrap{max-width:700px;margin:18px auto 0;position:relative}

.filter{padding:7px 16px;border-radius:20px;background:#1e293b;border:1px solid #334155;cursor:pointer;font-size:13px}
.filter.active{background:#38bdf8;color:#000;border-color:#38bdf8;font-weight:700}
.grid{max-width:1300px;margin:0 auto;padding:28px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:20px;transition:0.2s}
.card:hover{border-color:#38bdf8;transform:translateY(-3px)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tag{font-size:11px;padding:4px 10px;border-radius:20px;background:#0f172a;border:1px solid #334155;color:#94a3b8}
